version: 2

# Weekly updates, minor and patch grouped, few open PRs. The cooldown keeps freshly published
# versions out for a week, so a compromised release has time to be noticed and yanked. Majors
# arrive as single PRs. Tool versions pinned in workflow run lines (pip-audit, zizmor) are not
# covered; they are bumped by hand (docs/dependencies.md).

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
